[pytest]
# `pytest` lancé à la racine ne collecte que tests/ : les quatre services
# exposent chacun un package nommé `app`, et leurs conftest respectifs
# insèrent leur dossier dans sys.path. Les collecter dans un même
# processus fait gagner le premier `app` importé et casse les suivants
# (ImportError: cannot import name ... from 'app.main').
# Chaque suite de service se lance explicitement :
#   pytest services/model/tests
#   pytest services/backend/tests
#   pytest services/frontend/tests
testpaths = tests
