[pytest]
# `pytest` sans argument ne collecte que tests/ (suite rapide, sans service).
#
# Les quatre services exposent chacun un package nommé `app`. Leur
# cohabitation dans un même processus est désormais gérée par le
# `conftest.py` racine, qui réactive le bon service avant chaque import et
# chaque test. La commande complète passe donc en une seule invocation :
#   pytest tests services/model/tests services/backend/tests services/frontend/tests
testpaths = tests
