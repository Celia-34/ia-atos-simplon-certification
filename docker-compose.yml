services:
  model:
    # Contexte = racine du repo : l'image a besoin de src/ en plus de services/model/.
    build:
      context: .
      dockerfile: services/model/Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3

  feedback:
    build: ./services/feedback
    ports:
      - "8002:8002"
    volumes:
      - ./data:/data
      - ./scripts:/scripts:ro
    environment:
      DATA_DIR: /data
      SCRIPTS_DIR: /scripts
      FEEDBACK_DB: /data/feedbacks.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  backend:
    build: ./services/backend
    ports:
      - "8001:8001"
    environment:
      MODEL_URL: http://model:8000
      ALLOWED_ORIGINS: "*"
    depends_on:
      model:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3

  frontend:
    build: ./services/frontend
    ports:
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3


  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Aucun depends_on sur model/backend : Prometheus gere nativement les cibles
    # injoignables (metrique `up` a 0). Faire dependre la supervision de la sante
    # des services observes rendrait le panel UP/DOWN incapable d'afficher DOWN.

  grafana:
    image: grafana/grafana:11.2.2
    ports:
      - "3001:3000"            # 3001 hôte : évite le conflit 3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  mlflow:
    # Serveur de tracking des experiences (hors ligne). Aucun service applicatif
    # n'en depend : `model`, `backend`, `feedback` et `frontend` demarrent et
    # servent normalement si MLflow est absent. C'est deliberé — un serveur de
    # metadonnees indisponible ne doit jamais empecher de servir une prediction.
    #
    # Backend SQLite (et non un simple `file:`) : le Model Registry, qui porte
    # le cycle Staging -> Production sur lequel se branche `scripts/promotion.py`,
    # exige un backend relationnel.
    image: ghcr.io/mlflow/mlflow:v2.17.2
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --default-artifact-root /mlruns/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
